<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>橄榄公主的私房菜谱</title>
    <style>
        :root { --bg: #faf7f2; --card: #fff; --prime: #d97706; --text: #451a03; --muted: #78350f; --line: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 40px; line-height: 1.6; }
        header { background: var(--card); padding: 20px 16px 10px; text-align: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.4rem; font-weight: 600; }
        .category-nav { display: flex; overflow-x: auto; white-space: nowrap; background: var(--card); padding: 10px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 61px; z-index: 100; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-btn { padding: 6px 16px; margin: 0 4px; border-radius: 20px; background: #f4f4f5; color: #52525b; font-size: 0.9rem; border: none; flex-shrink: 0; cursor: pointer; transition: all 0.2s; }
        .category-btn.active { background: var(--prime); color: #fff; font-weight: bold; }
        .recipe-container { padding: 16px; }
        .recipe-card { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: none; }
        .recipe-card.show { display: block; }
        .recipe-img { width: 100%; height: 200px; object-fit: cover; background: #e5e7eb; }
        .recipe-content { padding: 16px; }
        .recipe-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
        .section-title { font-size: 1rem; font-weight: 600; margin: 16px 0 8px; padding-left: 8px; border-left: 3px solid var(--prime); color: var(--muted); }
        .ingredients-list { list-style: none; background: #fafafa; padding: 12px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .ingredient-item { font-size: 0.9rem; display: flex; align-items: center; user-select: none; }
        .ingredient-item input { margin-right: 6px; accent-color: var(--prime); }
        .ingredient-item input:checked + span { text-decoration: line-through; color: #a1a1aa; }
        .steps-list { list-style: none; }
        .step-item { position: relative; padding-left: 28px; margin-bottom: 14px; font-size: 0.95rem; }
        .step-number { position: absolute; left: 0; top: 2px; width: 20px; height: 20px; background: #fef3c7; color: var(--prime); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
        .timer-badge { background: #fef3c7; color: var(--prime); padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; margin-left: 4px; border: 1px solid #fde68a; }
        .timer-badge.running { background: var(--prime); color: #fff; border-color: var(--prime); }
    </style>
    <!-- 🔒 核心安全策略：直接引入本地的 recipes.js 配置文件，彻底粉碎跨域拦截限制 -->
    <script src="./recipes.js"></script>
</head>
<body>
    <header><h1>橄榄公主的私房菜谱</h1></header>
    <div class="category-nav" id="category-nav-box">
        <button class="category-btn active" onclick="filterCategory('全部')">全部</button>
    </div>
    <div class="recipe-container" id="recipe-box"></div>
    <script>
        let currentActiveCategory = '全部';

        document.addEventListener('DOMContentLoaded', () => {
            // 检测本地变量是否存在，给您最高等级的安全渲染保护
            if (typeof myRecipesData !== 'undefined' && Array.isArray(myRecipesData)) {
                generateDynamicMenu(myRecipesData);
                renderRecipes(myRecipesData);
            } else {
                document.getElementById('recipe-box').innerHTML = '<div style="text-align:center;padding:30px;color:#71717a;">⚠️ 未检测到 recipes.js 配置文件，请确认该文件已创建并拼写正确。</div>';
            }
        });

        function generateDynamicMenu(recipes) {
            const navBox = document.getElementById('category-nav-box');
            navBox.innerHTML = '<button class="category-btn active" onclick="filterCategory(\'全部\')">全部</button>';
            const categorySet = new Set();
            recipes.forEach(item => {
                const cat = item["分类"] ? item["分类"].toString().trim() : '';
                if (cat) { categorySet.add(cat); }
            });
            categorySet.forEach(catName => {
                navBox.innerHTML += `<button class="category-btn" onclick="filterCategory('${catName}')">${catName}</button>`;
            });
        }

        function renderRecipes(recipes) {
            const containerBox = document.getElementById('recipe-box'); 
            containerBox.innerHTML = '';
            recipes.forEach(recipe => {
                const category = (recipe["分类"] || '其他').trim();
                const title = (recipe["菜名"] || '未命名菜品').trim();
                const image = recipe["图片"] || 'https://unsplash.com';
                const ingredientsStr = recipe["所需食材"] || '';
                const stepsStr = recipe["步骤"] || '';

                const ingredientsArray = ingredientsStr ? ingredientsStr.split(',') : [];
                const stepsArray = stepsStr ? stepsStr.split('|') : [];

                let ingredientsHTML = '';
                ingredientsArray.forEach(item => {
                    if (item.trim()) ingredientsHTML += `<li class="ingredient-item"><label><input type="checkbox"><span>${item.trim()}</span></label></li>`;
                });

                let stepHTML = '';
                stepsArray.forEach((stepText, idx) => {
                    if (stepText.trim()) {
                        let text = stepText.trim(); 
                        const minuteMatch = text.match(/(\d+)\s*(?:分钟|min)/i);
                        if (minuteMatch) {
                            const minutesInt = parseInt(minuteMatch[10] || minuteMatch[1], 10); 
                            const matchedKeyword = minuteMatch[0];
                            text = text.replace(matchedKeyword, `<span class="timer-badge" onclick="startTimer(this, ${minutesInt})">⏱️ ${matchedKeyword}</span>`);
                        }
                        stepHTML += `<li class="step-item"><span class="step-number">${idx + 1}</span>${text}</li>`;
                    }
                });

                containerBox.innerHTML += `
                    <div class="recipe-card show" data-category="${category}">
                        <img src="${image}" class="recipe-img">
                        <div class="recipe-content">
                            <div class="recipe-title">${title}</div>
                            <div class="section-title">所需食材</div>
                            <ul class="ingredients-list">${ingredientsHTML}</ul>
                            <div class="section-title">做菜步骤</div>
                            <ol class="steps-list">${stepHTML}</ol>
                        </div>
                    </div>`;
            });
            filterCategory(currentActiveCategory);
        }

        function filterCategory(categoryName) {
            currentActiveCategory = categoryName;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${categoryName}'`));
            });
            document.querySelectorAll('.recipe-card').forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                card.style.display = (categoryName === '全部' || cardCategory === categoryName) ? 'block' : 'none';
            });
        }

        function startTimer(element, minutes) {
            if (element.classList.contains('running')) return;
            if (window.event) window.event.stopPropagation();
            element.classList.add('running'); 
            let totalSeconds = minutes * 60; 
            const originalBadgeText = element.innerHTML;
            const timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval); element.innerText = "🔔 时间到！"; element.classList.remove('running');
                    setTimeout(() => { element.innerHTML = originalBadgeText; }, 3000);
                } else {
                    element.innerText = `⏱️ ${Math.floor(totalSeconds / 60)}:${totalSeconds % 60 < 10 ? '0' : ''}${totalSeconds % 60}`; totalSeconds--;
                }
            }, 1000);
        }
    </script>
</body>
</html>
